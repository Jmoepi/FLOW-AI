# Local Postgres for development and tests only. Loopback-bound, password from .secrets/local-db.env (generated by
# `pnpm db:up`, never committed). Production uses Supabase; nothing here is used for hosted data.
name: flow-ai-local-db
services:
  postgres:
    image: postgres:16.9-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FLOW_LOCAL_PG_PASSWORD:?run pnpm db:up}
      POSTGRES_DB: flow_ai
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - flow_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flow_ai"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  flow_ai_pgdata:
